name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      LLM_PROVIDER: mock
      SECRET_KEY: ci-test-key
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check app tests
      - name: Tests (offline mock LLM)
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Component tests
        run: npm test
      - name: Typecheck and build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend, frontend]
    outputs:
      image_id: ${{ steps.export.outputs.image_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build image
        run: |
          docker build --tag trolleymate:ci \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" .
      - name: Start disposable mock server
        run: |
          docker run --detach --name trolleymate-ci --publish 127.0.0.1:8000:8000 \
            --env LLM_PROVIDER=mock --env SECRET_KEY=ci-test-key \
            --env DATABASE_URL=sqlite:////tmp/trolleymate-ci.db trolleymate:ci
      - name: Smoke test API and built frontend
        timeout-minutes: 3
        run: |
          python - <<'PY'
          import json
          import re
          import time
          from urllib.error import URLError
          from urllib.request import Request, urlopen

          base = "http://127.0.0.1:8000"
          def fetch(path, data=None, token=None):
              headers = {"Content-Type": "application/json"}
              if token:
                  headers["Authorization"] = f"Bearer {token}"
              payload = json.dumps(data).encode() if data is not None else None
              with urlopen(Request(base + path, data=payload, headers=headers), timeout=5) as response:
                  return response.read().decode()

          for attempt in range(30):
              try:
                  assert json.loads(fetch("/api/health"))["status"] == "ok"
                  break
              except (URLError, TimeoutError):
                  time.sleep(2)
          else:
              raise RuntimeError("Container did not become healthy")
          html = fetch("/")
          assert '<div id="root"></div>' in html
          assets = re.findall(r'(?:src|href)="(/assets/[^\"]+)"', html)
          assert any(path.endswith(".js") for path in assets)
          assert any(path.endswith(".css") for path in assets)
          for path in assets:
              assert fetch(path)
          login = json.loads(fetch("/api/auth/login", {"email": "riley@trolleymate.demo", "password": "demo1234"}))
          assert json.loads(fetch("/api/auth/me", token=login["token"]))["email"] == "riley@trolleymate.demo"
          print("Health, compiled frontend assets, and authenticated API passed.")
          PY
      - name: Container logs on failure
        if: failure()
        run: docker logs trolleymate-ci || true
      - name: Clean up container and temporary volume
        if: always()
        run: docker rm --force --volumes trolleymate-ci || true
      - name: Export the tested image
        id: export
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "image_id=$(docker image inspect --format '{{.Id}}' trolleymate:ci)" >> "$GITHUB_OUTPUT"
          docker save trolleymate:ci | gzip > "$RUNNER_TEMP/trolleymate-image.tar.gz"
      - name: Pass tested image to publisher
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: tested-image
          path: ${{ runner.temp }}/trolleymate-image.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          overwrite: true

  publish:
    name: Publish tested image to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      EXPECTED_IMAGE_ID: ${{ needs.docker.outputs.image_id }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tested-image
          path: ${{ runner.temp }}
      - name: Load and verify the tested image
        run: |
          docker load --input "$RUNNER_TEMP/trolleymate-image.tar.gz"
          test "$(docker image inspect --format '{{.Id}}' trolleymate:ci)" = "$EXPECTED_IMAGE_ID"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Check for an existing commit tag
        id: existing
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          from urllib.error import HTTPError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          repository = os.environ["GITHUB_REPOSITORY"].lower()
          credentials = base64.b64encode(f'{os.environ["GITHUB_ACTOR"]}:{os.environ["GH_TOKEN"]}'.encode()).decode()
          query = urlencode({"service": "ghcr.io", "scope": f"repository:{repository}:pull,push"})
          auth = Request(f"https://ghcr.io/token?{query}", headers={"Authorization": f"Basic {credentials}"})
          with urlopen(auth, timeout=30) as response:
              token = json.load(response)["token"]
          manifest = Request(
              f'https://ghcr.io/v2/{repository}/manifests/sha-{os.environ["GITHUB_SHA"]}',
              headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json"},
              method="HEAD",
          )
          try:
              with urlopen(manifest, timeout=30):
                  exists = True
          except HTTPError as error:
              if error.code != 404:
                  raise
              exists = False
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"exists={str(exists).lower()}\n")
          PY
      - name: Publish commit tag or reuse its original image
        env:
          COMMIT_EXISTS: ${{ steps.existing.outputs.exists }}
        run: |
          commit_image="$IMAGE:sha-$GITHUB_SHA"
          if [ "$COMMIT_EXISTS" = true ]; then
            docker pull "$commit_image"
            echo "Preserving the image already published for this commit."
          else
            docker tag trolleymate:ci "$commit_image"
            docker push "$commit_image"
          fi
      - name: Update latest only for the current main commit
        run: |
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$main_sha" = "$GITHUB_SHA" ]; then
            docker tag "$IMAGE:sha-$GITHUB_SHA" "$IMAGE:latest"
            docker push "$IMAGE:latest"
            echo "Published $IMAGE:sha-$GITHUB_SHA and $IMAGE:latest" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Published $IMAGE:sha-$GITHUB_SHA; latest unchanged because main has advanced." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
